<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator</title>
    <meta name="description" content="Kalkulator aritmetika sederhana yang berjalan di browser." />

    <link
      rel="preload"
      href="assets/fonts/ibm-plex-sans-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/ibm-plex-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="dist/tailwind.css" />

    <script>
      // Pasang tema sebelum paint supaya tidak ada kedipan.
      (function () {
        try {
          var saved = localStorage.getItem("kalkulator-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* localStorage diblokir: pakai tema terang */
        }
      })();
    </script>
  </head>

  <body class="min-h-dvh font-sans text-ink antialiased">
    <main class="grid min-h-dvh place-items-center px-4 py-8">
      <div class="w-full max-w-[380px]">
        <header class="mb-3 flex items-center justify-between px-1">
          <h1 class="text-[13px] font-medium tracking-[0.01em] text-muted">Kalkulator</h1>

          <button
            id="theme-toggle"
            type="button"
            aria-label="Ganti tema terang atau gelap"
            aria-pressed="false"
            class="flex size-9 cursor-pointer touch-manipulation items-center justify-center rounded-[10px] border border-line bg-surface text-muted transition-colors duration-100 hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          >
            <svg
              class="icon-sun"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg
              class="icon-moon hidden"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
            </svg>
          </button>
        </header>

        <section
          aria-label="Kalkulator"
          class="rounded-[20px] border border-line bg-surface p-4 shadow-[0_24px_48px_-30px_rgba(0,0,0,0.45)] sm:p-5"
        >
          <div class="rounded-[13px] border border-line bg-surface-2 px-4 pb-4 pt-3">
            <div
              id="expression"
              class="h-5 overflow-hidden whitespace-nowrap text-right font-mono text-[12px] font-medium leading-5 text-muted"
            >
              &nbsp;
            </div>
            <div
              id="display"
              class="display-value mt-2 overflow-hidden whitespace-nowrap text-right font-mono font-medium leading-none text-ink"
            >
              0
            </div>
            <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
          </div>

          <div role="group" aria-label="Tombol kalkulator" class="mt-4 grid grid-cols-4 gap-2">
            <button
              type="button"
              class="key key--fn"
              data-action="clear"
              data-key="Escape"
              aria-label="Hapus semua"
            >
              AC
            </button>
            <button
              type="button"
              class="key key--fn"
              data-action="backspace"
              data-key="Backspace"
              aria-label="Hapus digit terakhir"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 5H9L3 12l6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z" />
                <path d="m12 9 5 6M17 9l-5 6" />
              </svg>
            </button>
            <button
              type="button"
              class="key key--fn"
              data-action="percent"
              data-key="%"
              aria-label="Persen"
            >
              %
            </button>
            <button
              type="button"
              class="key key--op"
              data-action="operator"
              data-value="/"
              data-key="/"
              aria-label="Bagi"
            >
              ÷
            </button>

            <button type="button" class="key" data-action="digit" data-value="7" data-key="7">7</button>
            <button type="button" class="key" data-action="digit" data-value="8" data-key="8">8</button>
            <button type="button" class="key" data-action="digit" data-value="9" data-key="9">9</button>
            <button
              type="button"
              class="key key--op"
              data-action="operator"
              data-value="*"
              data-key="*"
              aria-label="Kali"
            >
              ×
            </button>

            <button type="button" class="key" data-action="digit" data-value="4" data-key="4">4</button>
            <button type="button" class="key" data-action="digit" data-value="5" data-key="5">5</button>
            <button type="button" class="key" data-action="digit" data-value="6" data-key="6">6</button>
            <button
              type="button"
              class="key key--op"
              data-action="operator"
              data-value="-"
              data-key="-"
              aria-label="Kurang"
            >
              −
            </button>

            <button type="button" class="key" data-action="digit" data-value="1" data-key="1">1</button>
            <button type="button" class="key" data-action="digit" data-value="2" data-key="2">2</button>
            <button type="button" class="key" data-action="digit" data-value="3" data-key="3">3</button>
            <button
              type="button"
              class="key key--op"
              data-action="operator"
              data-value="+"
              data-key="+"
              aria-label="Tambah"
            >
              +
            </button>

            <button
              type="button"
              class="key"
              data-action="sign"
              data-key="s"
              aria-label="Ubah tanda"
            >
              ±
            </button>
            <button type="button" class="key" data-action="digit" data-value="0" data-key="0">0</button>
            <button
              type="button"
              class="key"
              data-action="decimal"
              data-key="."
              aria-label="Koma desimal"
            >
              ,
            </button>
            <button
              type="button"
              class="key key--equals"
              data-action="equals"
              data-key="Enter"
              aria-label="Hitung"
            >
              =
            </button>
          </div>
        </section>

        <p class="mt-4 text-center text-[12px] leading-5 text-muted">
          Enter untuk hitung, Esc untuk hapus semua
        </p>
      </div>
    </main>

    <script src="src/calculator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
